version = 1
revision = 3
requires-python = ">=3.12"

[manifest]

[[manifest.dependency-metadata]]
name = "nvidia-curobo"
version = "0.7.7.post1.dev5"
requires-dist = ["pybind11", "networkx", "numpy", "numpy-quaternion", "pyyaml", "setuptools-scm>=6.2", "torch>=1.10", "trimesh", "yourdfpy>=0.0.53", "warp-lang>=0.9.0", "scipy>=1.7.0", "tqdm", "wheel", "importlib-resources", "scikit-image"]
provides-extras = ["ci", "smooth", "usd", "dev", "isaacsim", "doc"]

[[manifest.dependency-metadata]]
name = "pytorch3d"
version = "0.7.5"
requires-dist = ["fvcore", "iopath"]
provides-extras = ["all", "dev", "implicitron"]
