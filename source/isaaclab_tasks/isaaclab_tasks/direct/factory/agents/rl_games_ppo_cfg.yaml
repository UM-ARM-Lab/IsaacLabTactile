params:
  seed: 0
  algo:
    name: a2c_continuous

  env:
    clip_actions: 1.0

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: False
    mlp:
      units: [512, 128, 64]
      activation: elu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None

    rnn:
      name: lstm
      units: 1024
      layers: 2
      before_mlp: True
      concat_input: True
      layer_norm: True

  load_checkpoint: False
  load_path: ""

  # Task-specific overrides (e.g., Factory peg insertion specific parameters)
  task_overrides:
    # Friction between gripper and peg (held asset). If set, overrides held_asset_cfg.friction and robot_cfg.friction.
    # Set to null to use individual config values, or specify a float value (e.g., 1.0)
    # Ignored when gripper_peg_friction_randomization is true.
    gripper_peg_friction: null

    # Domain randomization: gripper-peg friction sampled uniformly per env at each reset.
    gripper_peg_friction_randomization: True  # Set to true to enable friction domain randomization
    gripper_peg_friction_range: [0.5, 0.75]   # [min, max] friction when randomization is enabled

    # Observation noise for domain randomization
    # Set enable_obs_noise to true to enable observation noise
    # Individual noise parameters are configured in factory_env_cfg.py (ObsRandCfg)
    obs_noise:
      enable_obs_noise: False  # Set to true to enable observation noise

    # Include held asset observations (held_pos_rel_fixed and held_quat) in obs_order
    # When enabled, adds held object position relative to fixed asset and held object orientation to policy observations
    include_held_asset_obs: True  # Set to true to include held_pos_rel_fixed and held_quat in observations

    # Tactile transfer configuration (used when training with tactile sensor and transfer model)
    # If transfer_checkpoint is provided, observations will be transferred before being saved to replay buffer
    tactile_transfer:
      # Path to tactile transfer model checkpoint (.pt). Set to null to disable transfer.
      transfer_checkpoint: null
      # Direction of transfer: A_to_B (use model_A) or B_to_A (use model_B)
      transfer_direction: A_to_B
      # If enabled, transfer both tactile images and vector observations; otherwise only tactile images
      decode_observations: False

  config:
    name: Factory
    device: cuda:0
    env_name: rlgpu
    multi_gpu: False
    ppo: True
    mixed_precision: True
    normalize_input: True
    normalize_value: True
    value_bootstrap: True
    num_actors: 128
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.995
    tau: 0.95
    learning_rate: 1.0e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.008
    score_to_win: 20000
    max_epochs: 1500
    save_best_after: 10
    save_frequency: 20
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0  # 0.0001  # 0.0
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 128
    minibatch_size: 512  # batch size = num_envs * horizon_length; minibatch_size = batch_size / num_minibatches
    mini_epochs: 4
    critic_coef: 2
    clip_value: True
    seq_length: 128
    bounds_loss_coef: 0.0001

    central_value_config:
      minibatch_size: 512
      mini_epochs: 4
      learning_rate: 1e-4
      lr_schedule: adaptive
      kl_threshold: 0.008
      clip_value: True
      normalize_input: True
      truncate_grads: True

      network:
        name: actor_critic
        central_value: True

        mlp:
          units: [512, 128, 64]
          activation: elu
          d2rl: False

          initializer:
            name: default
          regularizer:
            name: None

        rnn:
          name: lstm
          units: 1024
          layers: 2
          before_mlp: True
          concat_input: True
          layer_norm: True

    player:
      deterministic: False
