params:
  seed: 0
  algo:
    name: a2c_continuous

  env:
    clip_actions: 1.0

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: False
    mlp:
      units: [512, 128, 64]
      activation: elu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None

    rnn:
      name: lstm
      units: 1024
      layers: 2
      before_mlp: True
      concat_input: True
      layer_norm: True

  load_checkpoint: False
  load_path: ""

  # Task-specific overrides (e.g., Factory peg insertion specific parameters)
  task_overrides:
    # Friction between gripper and peg (held asset). If set, overrides held_asset_cfg.friction and robot_cfg.friction.
    # Set to null to use individual config values, or specify a float value (e.g., 1.0)
    # Ignored when gripper_peg_friction_randomization is true.
    gripper_peg_friction: null

    # Domain randomization: gripper-peg friction sampled uniformly per env at each reset.
    gripper_peg_friction_randomization: False  # Set to true to enable friction domain randomization
    gripper_peg_friction_range: [0.5, 0.75]   # [min, max] friction when randomization is enabled

    # Observation noise for domain randomization
    # Set enable_obs_noise to true to enable observation noise
    # Individual noise parameters are configured in factory_env_cfg.py (ObsRandCfg)
    obs_noise:
      enable_obs_noise: False  # Set to true to enable observation noise

    # Include held asset observations (held_pos_rel_fixed and held_quat) in obs_order
    # When enabled, adds held object position relative to fixed asset and held object orientation to policy observations
    include_held_asset_obs: False  # Set to true to include held_pos_rel_fixed and held_quat in observations

    # Tactile transfer configuration (used when training with tactile sensor and transfer model)
    # If transfer_checkpoint is provided, observations will be transferred before being saved to replay buffer
    tactile_transfer:
      # Path to tactile transfer model checkpoint (.pt). Set to null to disable transfer.
      transfer_checkpoint: null
      # Direction of transfer: A_to_B (use model_A) or B_to_A (use model_B)
      transfer_direction: A_to_B
      # If enabled, transfer both tactile images and vector observations; otherwise only tactile images
      decode_observations: False

    # Point-MAE tactile point cloud encoder configuration (optional).
    # This is primarily intended for experiments that also enable tactile point clouds
    # in the environment config. When enabled, a latent token from PointMAE will be
    # concatenated to the vector observations for the policy.
    tactile_pointmae:
      # checkpoint: "/home/fanyang/github/tactile_transfer/outputs/point_mae_pc/point_mae_epoch_0050.pth"
      checkpoint: null  # set to null to disable Point-MAE
      # Optional: Sinkhorn-trained point-latent projector (tactile_transfer/script/train_point_latent_projection_sinkhorn.py).
      # When set, the pooled PointMAE latent is passed through this MLP before concatenation (same embed_dim).
      # sinkhorn_projection_checkpoint: /home/fanyang/github/tactile_transfer/outputs/point_latent_projection_sinkhorn_0007_eps_002/point_latent_projection_epoch_2000.pth
      sinkhorn_projection_checkpoint: null
      pc_keys:
        - tactile_pc_left_w
        - tactile_pc_right_w
        - tactile_pc_peg_w
      force_keys:
        left_force: fingertip_force_left
        left_wrench: fingertip_wrench_left
        right_force: fingertip_force_right
        right_wrench: fingertip_wrench_right

    # Tactile-image MAE encoder configuration (optional).
    # When enabled during training, a pooled tactile-image latent is concatenated
    # to vector observations for policy conditioning.
    tactile_image_mae:
      # Path to tactile-image MAE checkpoint (.pth). Set to null to disable.
      # checkpoint: /home/fanyang/github/tactile_transfer/outputs/tactile_mae_images/tactile_image_mae_epoch_0200.pth
      checkpoint: null
      # Key name in `obs_dict` if present (wrapper also supports reading directly from env).
      tactile_obs_key: tactile

    # Rectified-flow latent OT: direction is read from the transfer checkpoint (`direction` key).
    # This is appended to vector observations at play time in `rl_games/play.py`.
    tactile_transfer_latent_ot:
      # Path to rectified-flow latent OT checkpoint (.pt). If null, the wrapper is disabled.
      transfer_checkpoint: /home/fanyang/github/tactile_transfer/outputs/rf_latent_ot_0002_high_eps_skip_norm/rectified_flow_latent_epoch_5000.pth
      # transfer_checkpoint: /home/fanyang/github/tactile_transfer/outputs/rf_latent_ot_0005_skip_norm_img2pc/rectified_flow_latent_epoch_5000.pth
      # transfer_checkpoint: null
      # Path to tactile-image MAE checkpoint (.pth).
      # image_mae_checkpoint: /home/fanyang/github/tactile_transfer/outputs/tactile_mae_images/tactile_image_mae_epoch_0200.pth
      image_mae_checkpoint: null
      # For pc_to_image checkpoints: Point-MAE checkpoint.
      point_mae_checkpoint: /home/fanyang/github/tactile_transfer/outputs/point_mae_pc/point_mae_epoch_0050.pth
      # point_mae_checkpoint: null
      # Point-cloud gather keys used when the transfer checkpoint direction is pc_to_image.
      pc_keys:
        - tactile_pc_left_w
        - tactile_pc_right_w
        - tactile_pc_peg_w
      force_keys:
        left_force: fingertip_force_left
        left_wrench: fingertip_wrench_left
        right_force: fingertip_force_right
        right_wrench: fingertip_wrench_right
      # Optional (pc_to_image only): projection MLP checkpoint trained by
      # tactile_transfer/script/train_point_latent_projection_sinkhorn.py.
      # If null, no post-PointMAE projection is applied.
      point_latent_projection_checkpoint: /home/fanyang/github/tactile_transfer/outputs/point_latent_projection_sinkhorn_0007_eps_002/point_latent_projection_epoch_2000.pth
      # point_latent_projection_checkpoint: null
      # Key name in `obs_dict` if present (wrapper also supports reading directly from env).
      tactile_obs_key: tactile
      # Euler steps used to integrate the learned latent flow.
      euler_steps: 32

  config:
    name: Factory
    device: cuda:0
    env_name: rlgpu
    multi_gpu: False
    ppo: True
    mixed_precision: True
    normalize_input: True
    normalize_value: True
    value_bootstrap: True
    num_actors: 128
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.995
    tau: 0.95
    learning_rate: 1.0e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.008
    score_to_win: 20000
    max_epochs: 500
    save_best_after: 10
    save_frequency: 20
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0  # 0.0001  # 0.0
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 128
    minibatch_size: 512  # batch size = num_envs * horizon_length; minibatch_size = batch_size / num_minibatches
    mini_epochs: 4
    critic_coef: 2
    clip_value: True
    seq_length: 128
    bounds_loss_coef: 0.0001

    central_value_config:
      minibatch_size: 512
      mini_epochs: 4
      learning_rate: 1e-4
      lr_schedule: adaptive
      kl_threshold: 0.008
      clip_value: True
      normalize_input: True
      truncate_grads: True

      network:
        name: actor_critic
        central_value: True

        mlp:
          units: [512, 128, 64]
          activation: elu
          d2rl: False

          initializer:
            name: default
          regularizer:
            name: None

        rnn:
          name: lstm
          units: 1024
          layers: 2
          before_mlp: True
          concat_input: True
          layer_norm: True

    player:
      deterministic: False
