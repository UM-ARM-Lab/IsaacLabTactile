params:
  seed: 0
  algo:
    name: a2c_continuous

  env:
    clip_actions: 1.0

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: False
    mlp:
      units: [512, 128, 64]
      activation: elu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None

    # rnn:
    #   name: lstm
    #   units: 1024
    #   layers: 2
    #   before_mlp: True
    #   concat_input: True
    #   layer_norm: True

  load_checkpoint: False
  load_path: ""

  # Task-specific overrides (e.g., Factory peg insertion specific parameters)
  task_overrides:
    # Override ctrl.use_full_rotation (peg_insert/gear_mesh default true, nut_thread default false).
    use_full_rotation: null

    # Friction between gripper and peg (held asset). If set, overrides held_asset_cfg.friction and robot_cfg.friction.
    # Set to null to use individual config values, or specify a float value (e.g., 1.0)
    # Ignored when gripper_peg_friction_randomization is true.
    gripper_peg_friction: null

    # Friction on the fixed asset (socket/hole). If set, overrides fixed_asset_cfg.friction (default 0.75).
    # Ignored when fixed_asset_friction_randomization is true.
    fixed_asset_friction: null

    # Domain randomization: fixed-asset (socket/hole) friction sampled uniformly per env at each reset.
    fixed_asset_friction_randomization: True
    fixed_asset_friction_range: [0.75, 1.25]  # [min, max] friction when randomization is enabled

    # Domain randomization: gripper-peg friction sampled uniformly per env at each reset.
    gripper_peg_friction_randomization: True  # Set to False to enable friction domain randomization
    gripper_peg_friction_range: [0.5, 0.75]   # [min, max] friction when randomization is enabled

    # Elastomer compliance stiffness for tactile sensors (left and right fingers).
    elastomer_stiffness: 350.0

    # Gripper finger joint PD gains (panda_hand actuator stiffness / damping).
    gripper_kp: 500.0
    gripper_kd: 40.0

    # Gripper finger PD gain domain randomization (panda_hand stiffness / damping).
    # Samples multiplicative scales on gripper_kp / gripper_kd at each episode reset.
    gripper_kp_kd_randomization: True
    gripper_kp_scale_range: [0.5, 1.1]
    gripper_kd_scale_range: [0.8, 1.2]

    # Arm operational-space control gain domain randomization (task_prop_gains / task_deriv_gains).
    # Samples multiplicative scales on base gains every control update.
    arm_control_gain_randomization: True
    arm_kp_scale_range: [0.8, 1.2]  # multiplicative on task Kp (xyz position + xyz rotation)
    arm_kd_scale_range: [0.8, 1.2]

    # Arm joint friction domain randomization (panda_joint[1-7] actuator friction).
    # panda_arm1 (joints 1-4) and panda_arm2 (joints 5-7) share the same sampled value per env.
    # Resampled at each episode reset.
    joint_friction_randomization: False
    joint_friction_range: [0.0, 0.2]  # [min, max] friction when randomization is enabled

    # Additive Gaussian noise on xyz position command (meters) at execution time.
    # std=0 disables noise. Sampled once per env step; does not affect EMA memory, orientation, or prev_actions.
    action_noise_std: 0.00

    # FORGE-style action threshold domain randomization (pos/rot per-step clip limits).
    # Resampled at each episode reset. noise_level is shared across xyz axes.
    action_threshold_randomization: False
    pos_threshold_noise_level: 0.25  # multiplier range [1/(1+eps), 1+eps] per axis
    rot_threshold_noise_level: 0.29

    # Wrist F/T sensor contact-force penalty (FORGE-style).
    enable_contact_penalty: True  # false = off; true = on (uses contact_penalty_scale or task default)
    contact_penalty_scale: null  # only when enable_contact_penalty=true; null = task default (peg_insert: 0.2)
    contact_penalty_threshold_range: null  # null = task default [2.0, 8.0] N

    # Observation noise for domain randomization
    # Set enable_obs_noise to true to enable observation noise
    # Individual noise parameters are configured in factory_env_cfg.py (ObsRandCfg)
    obs_noise:
      enable_obs_noise: False  # Set to true to enable observation noise

    # Include held asset observations (held_pos_rel_fixed and held_quat) in obs_order
    # When enabled, adds held object position relative to fixed asset and held object orientation to policy observations
    include_held_asset_obs: False  # Set to true to include held_pos_rel_fixed and held_quat in observations

    # Include previous action vector in policy observations.
    # Assumes obs history is disabled (history_length == 0).
    include_prev_actions: True  # Set to false to drop prev_actions from policy observation

    # Tactile point cloud domain randomization (held object only).
    # Adds Gaussian noise to held-object pose before rendering tactile_pc_peg_w.
    # Finger point clouds are unchanged. std=0 uses clean ground-truth pose.
    tactile_pointcloud_dr:
      held_pos_noise_std: 0.0005   # meters
      held_rot_noise_std: 0.005   # radians (axis-angle components)

    # Tactile observation wrapper (refactored).
    # Choose ONE wrapper to append a latent token to policy vector observations.
    tactile_obs_wrapper:
      # name: ot  # one of: null, mae, point_mae, ot, double_ot
      # name: null  # one of: null, mae, point_mae, ot, double_ot
      # name: mae  # one of: null, mae, point_mae, ot, double_ot
      name: point_mae  # one of: null, mae, point_mae, ot, double_ot
      # name: double_ot  # sim point MAE -> RF hop1 (point->image) -> RF hop2 (image->point); checkpoints.ot + point_mae; optional checkpoints.ot_2 for hop 2
      use_projection: false  # applies when name == "mae", "point_mae", or "ot" (source branch for OT depends on projection ckpt metadata)
      force_input_noise_std: 0.3  # additive N(0, std) on PointMAE force input; 0 = off (point_mae|ot)
      projection_source_latent: point  # OT-only optional override/validation: point|image; null auto-detects from projection ckpt
      ot_euler_steps: 4  # double_ot hop 1 (point->image); also hop 2 default unless ot_euler_steps_hop2 is set
      ot_euler_steps_hop2: null  # double_ot hop 2 (image->point); null = use ot_euler_steps
      # double_ot: checkpoints.ot is hop 1 (point->image). Set checkpoints.ot_2 for hop 2 (image->point).
      # data_to_data: ot_2 null reuses ot with reverse integration on hop 2.
      # noise_to_data_latent_cond: requires ot_2; each hop integrates N(0,I)->target with source latent as cond (no reverse).
      ot_reverse_direction: false  # true: run reverse of checkpoint training direction
      checkpoints:
        # ot: /home/fanyang/github/tactile_transfer/outputs/rf_latent_ot_0144_ot_peg/rectified_flow_latent_epoch_2000.pth
        # ot: /home/fanyang/github/tactile_transfer/outputs/rf_latent_ot_0172_ot_peg_pc_to_image/rectified_flow_latent_epoch_5000.pth
        # ot: /home/fanyang/github/tactile_transfer/outputs/rf_latent_ot_0171_ot_peg_image_to_pc/rectified_flow_latent_epoch_5000.pth
        # ot: /home/fanyang/github/tactile_transfer/outputs/rf_latent_ot_0173_ot_gear_image_to_pc/rectified_flow_latent_epoch_5000.pth
        # ot: /home/fanyang/github/tactile_transfer/outputs/rf_latent_ot_0178_ot_nut_pc_to_image/rectified_flow_latent_epoch_5000.pth
        # ot: /home/fanyang/github/tactile_transfer/outputs/rf_latent_ot_0177_ot_nut_image_to_pc/rectified_flow_latent_epoch_5000.pth
        # ot: /home/fanyang/github/tactile_transfer/outputs/rf_latent_ot_0174_ot_gear_pc_to_image/rectified_flow_latent_epoch_5000.pth
        # ot: /home/fanyang/github/tactile_transfer/outputs/rf_latent_ot_0173_ot_gear_image_to_pc/rectified_flow_latent_epoch_5000.pth
        ot: /home/fanyang/github/tactile_transfer/outputs/rf_latent_ot_0186_hardware_peg_pc_to_image/rectified_flow_latent_epoch_20000.pth
        # ot: null
        # ot_2: /home/fanyang/github/tactile_transfer/outputs/rf_latent_ot_0173_ot_gear_image_to_pc/rectified_flow_latent_epoch_5000.pth
        # ot_2: /home/fanyang/github/tactile_transfer/outputs/rf_latent_ot_0177_ot_nut_image_to_pc/rectified_flow_latent_epoch_5000.pth
        ot_2: /home/fanyang/github/tactile_transfer/outputs/rf_latent_ot_0185_hardware_peg_image_to_pc/rectified_flow_latent_epoch_20000.pth
        # ot_2: /home/fanyang/github/tactile_transfer/outputs/rf_latent_ot_0171_ot_peg_image_to_pc/rectified_flow_latent_epoch_5000.pth
        # point_mae: /home/fanyang/github/tactile_transfer/outputs/point_mae/0027_nut_no_wrench/point_mae_epoch_0005.pth
        # point_mae: /home/fanyang/github/tactile_transfer/outputs/point_mae/0022_gear_no_wrench/point_mae_epoch_0005.pth
        # point_mae: /home/fanyang/github/tactile_transfer/outputs/point_mae/0026_peg_no_wrench/point_mae_epoch_0005.pth
        point_mae: /home/fanyang/github/tactile_transfer/outputs/point_mae/0029_all_no_wrench/point_mae_epoch_0005.pth
        # point_mae: null
        # mae: /home/fanyang/github/tactile_transfer/outputs/tactile_mae_images/0028_nut/tactile_image_mae_epoch_0300.pth
        # mae: /home/fanyang/github/tactile_transfer/outputs/tactile_mae_images/0012_gear/tactile_image_mae_epoch_0300.pth
        # mae: /home/fanyang/github/tactile_transfer/outputs/tactile_mae_images/0024_peg/tactile_image_mae_epoch_0300.pth
        # mae: /home/fanyang/github/tactile_transfer/outputs/tactile_mae_images/0030_all/tactile_image_mae_epoch_0300.pth
        # mae: /home/fanyang/github/tactile_transfer/outputs/tactile_mae_images/0032_peg/tactile_image_mae_epoch_0500.pth
        # mae: /home/fanyang/github/tactile_transfer/outputs/tactile_mae_images/0033_peg/tactile_image_mae_epoch_0500.pth
        mae: null
        projection: null
      tactile_obs_key: [tactile, tactile_right]
      # tactile_obs_key: [tactile]
      pc_keys:
        - tactile_pc_left_w
        - tactile_pc_right_w
        - tactile_pc_peg_w
      force_keys:
        left_force: left_finger_force
        left_wrench: left_finger_wrench
        right_force: right_finger_force
        right_wrench: right_finger_wrench

  config:
    name: Factory
    device: cuda:0
    env_name: rlgpu
    multi_gpu: False
    ppo: True
    mixed_precision: True
    normalize_input: True
    normalize_value: True
    value_bootstrap: True
    num_actors: 128
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.995
    tau: 0.95
    learning_rate: 1.0e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.008
    score_to_win: 20000
    max_epochs: 150  # total epochs from scratch; additional epochs when resuming from a checkpoint
    save_best_after: 10
    save_frequency: 20
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0  # 0.0001  # 0.0
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 128
    # minibatch_size: 512  # batch size = num_envs * horizon_length; minibatch_size = batch_size / num_minibatches
    minibatch_size: 4096  # batch size = num_envs * horizon_length; minibatch_size = batch_size / num_minibatches
    mini_epochs: 4
    critic_coef: 2
    clip_value: True
    seq_length: 128
    bounds_loss_coef: 0.0001

    central_value_config:
      minibatch_size: 512
      mini_epochs: 4
      learning_rate: 1e-4
      lr_schedule: adaptive
      kl_threshold: 0.008
      clip_value: True
      normalize_input: True
      truncate_grads: True

      network:
        name: actor_critic
        central_value: True

        mlp:
          units: [512, 128, 64]
          activation: elu
          d2rl: False

          initializer:
            name: default
          regularizer:
            name: None

        rnn:
          name: lstm
          units: 1024
          layers: 2
          before_mlp: True
          concat_input: True
          layer_norm: True

    player:
      deterministic: True
