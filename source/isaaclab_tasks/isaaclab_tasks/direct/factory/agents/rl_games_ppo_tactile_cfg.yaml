# Agent configuration for factory peg insertion with tactile sensor
# This config uses CNN for tactile images and MLP for vector observations

params:
  seed: 42
  algo:
    name: a2c_continuous

  env:
    clip_actions: 1.0
    clip_observations: 5.0
    # Configure observation groups - separate tactile images from vector observations
    obs_groups:
      obs: ["vector_obs", "tactile"]  # Must match keys returned by environment
      states: ["critic"]  # Critic observations (asymmetric actor-critic)
    concate_obs_groups: False  # IMPORTANT: Keep groups separate for CNN+MLP routing
    concate_state_groups: True  # Concatenate critic observations into a single tensor

  model:
    name: continuous_a2c_logstd

  network:
    name: multi_modal_actor_critic
    separate: False

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: False
    
    # CNN for processing tactile images (320x240x3)
    # RL-Games will automatically route "tactile" group to CNN based on shape
    cnn:
      type: conv2d
      activation: relu
      initializer:
        name: default
      regularizer:
        name: None
      permute_input: False
      convs:
        - filters: 8
          kernel_size: 8
          strides: 4
          padding: 0
        - filters: 16
          kernel_size: 4
          strides: 2
          padding: 0
        - filters: 16
          kernel_size: 3
          strides: 1
          padding: 0
        - filters: 16
          kernel_size: 3
          strides: 1
          padding: 0
    
    # MLP for processing vector observations (robot state, object state, velocities, actions)
    # RL-Games will automatically route "vector_obs" group (augmented with Point-MAE latent
    # when enabled) to this MLP based on shape.
    mlp:
      units: [512, 128, 64]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: False
  load_path: ""

  # Task-specific overrides (e.g., Factory peg insertion specific parameters)
  task_overrides:
    # Use real calibration file (polycalib_real.npz) instead of simulated calibration (polycalib.npz)
    use_real_calib: True
    # Friction between gripper and peg (held asset). If set, overrides held_asset_cfg.friction and robot_cfg.friction.
    # Set to null to use individual config values, or specify a float value (e.g., 1.0)
    # Ignored when gripper_peg_friction_randomization is true.
    gripper_peg_friction: 0.75

    # Domain randomization: gripper-peg friction sampled uniformly per env at each reset.
    gripper_peg_friction_randomization: False  # Set to true to enable friction domain randomization
    gripper_peg_friction_range: [0.4, 1.0]   # [min, max] friction when randomization is enabled

    # Observation noise for domain randomization
    # Set enable_obs_noise to true to enable observation noise
    # Individual noise parameters are configured in factory_env_cfg.py (ObsRandCfg)
    obs_noise:
      enable_obs_noise: False  # Set to true to enable observation noise
    
    # Include held asset observations (held_pos_rel_fixed and held_quat) in obs_order
    # When enabled, adds held object position relative to fixed asset and held object orientation to policy observations
    include_held_asset_obs: False  # Set to true to include held_pos_rel_fixed and held_quat in observations
    
    # -------------------------------------------------------------------------
    # Tactile observation wrapper (refactored)
    #
    # Choose ONE wrapper to append a latent token to the policy's vector observations.
    # Options:
    # - null      : no additional tactile latent conditioning
    # - mae       : tactile-image MAE pooled latent
    # - point_mae : tactile point-cloud Point-MAE pooled latent (optional projection)
    # - ot        : rectified-flow latent OT (direction comes from OT checkpoint)
    #
    # Checkpoints are listed once under `checkpoints` and are shared across wrappers.
    # `use_projection` applies when name == "mae", "point_mae", and also for name == "ot".
    # For OT, projection is applied on whichever source latent branch the projection
    # checkpoint was trained on ("point" or "image").
    tactile_obs_wrapper:
      name: null  # one of: null, mae, point_mae, ot
      use_projection: false
      gaussian_dropout:
        enable: false  # multiplicative N(1, sigma) on final policy latent; applies when name == mae|point_mae|ot
        std_range: [0.0, 0.1]
        # per-episode sigma sampled uniformly from std_range; each step applies latent *= N(1, sigma)
      force_input_noise:
        enable: false  # additive N(0, std) on forces before PointMAE encoder (eval/inference only)
        std: 0.0
      projection_source_latent: null  # OT-only optional override/validation: point|image; null auto-detects from projection ckpt
      checkpoints:
        # Point-MAE checkpoint (.pth) saved by tactile_transfer/script/train_point_mae.py
        point_mae: null
        # Tactile-image MAE checkpoint (.pth) saved by tactile_transfer/script/train_tactile_image_mae.py
        mae: null
        # Rectified-flow latent OT checkpoint (.pth) saved by tactile_transfer/script/train_rectified_flow_latent_ot.py
        ot: null
        # Optional: point-latent projection MLP checkpoint (.pth) saved by
        # tactile_transfer/script/train_point_latent_projection_sinkhorn.py
        projection: null
      # Common observation key for tactile images (used by "mae" and OT when direction=image_to_pc)
      tactile_obs_key: tactile
      # Point-cloud gather settings (used by "point_mae" and OT when direction=pc_to_image)
      pc_keys:
        - tactile_pc_left_w
        - tactile_pc_right_w
        - tactile_pc_peg_w
      force_keys:
        left_force: fingertip_force_left
        left_wrench: fingertip_wrench_left
        right_force: fingertip_force_right
        right_wrench: fingertip_wrench_right
      # OT integration settings (only used when name == "ot")
      ot_euler_steps: 32

  config:
    name: Factory_Tactile
    device: cuda:0
    env_name: rlgpu
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True  # Normalize vector observation inputs
    normalize_value: True
    value_bootstrap: True
    num_actors: 128
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.995
    tau: 0.95
    learning_rate: 1.0e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.008
    score_to_win: 20000
    max_epochs: 500
    save_best_after: 10
    save_frequency: 20
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0
    # entropy_coef: 0.0001
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 128
    minibatch_size: 512  # batch size = num_envs * horizon_length; minibatch_size = batch_size / num_minibatches
    mini_epochs: 4
    critic_coef: 2
    clip_value: True
    seq_length: 128
    bounds_loss_coef: 0.0001

    central_value_config:
      minibatch_size: 512
      mini_epochs: 4
      learning_rate: 1e-4
      lr_schedule: adaptive
      kl_threshold: 0.008
      clip_value: True
      normalize_input: True
      truncate_grads: True

      network:
        name: actor_critic
        central_value: True

        mlp:
          units: [512, 128, 64]
          activation: elu
          d2rl: False
          initializer:
            name: default
          regularizer:
            name: None
        rnn:
          name: lstm
          units: 1024
          layers: 2
          before_mlp: True
          concat_input: True
          layer_norm: True
    player:
      deterministic: False
