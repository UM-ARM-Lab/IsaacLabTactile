# Agent configuration for factory peg insertion with tactile sensor
# This config uses CNN for tactile images and MLP for vector observations

params:
  seed: 42
  algo:
    name: a2c_continuous

  env:
    clip_actions: 1.0
    clip_observations: 5.0
    # Configure observation groups - separate tactile images from vector observations
    obs_groups:
      obs: ["vector_obs", "tactile"]  # Must match keys returned by environment
      states: ["critic"]  # Critic observations (asymmetric actor-critic)
    concate_obs_groups: False  # IMPORTANT: Keep groups separate for CNN+MLP routing
    concate_state_groups: True  # Concatenate critic observations into a single tensor

  model:
    name: continuous_a2c_logstd

  network:
    name: multi_modal_actor_critic
    separate: False

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: False
    
    # CNN for processing tactile images (320x240x3)
    # RL-Games will automatically route "tactile" group to CNN based on shape
    cnn:
      type: conv2d
      activation: relu
      initializer:
        name: default
      regularizer:
        name: None
      permute_input: False
      convs:
        - filters: 8
          kernel_size: 8
          strides: 4
          padding: 0
        - filters: 16
          kernel_size: 4
          strides: 2
          padding: 0
        - filters: 16
          kernel_size: 3
          strides: 1
          padding: 0
        - filters: 16
          kernel_size: 3
          strides: 1
          padding: 0
    
    # MLP for processing vector observations (robot state, object state, velocities, actions).
    # RL-Games routes the "vector_obs" group to this MLP based on shape.
    mlp:
      units: [512, 128, 64]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: False
  load_path: ""
  # When true with --checkpoint, load only central value critic (assymetric_vf_nets), not the actor.
  # Useful when actor architecture differs (e.g. tactile CNN vs point-cloud latent). CLI: --load-critic-only
  load_critic_only: False

  # Task-specific overrides (e.g., Factory peg insertion specific parameters)
  task_overrides:
    # Use real-world GelSight Mini assets from gs_mini_data (polycalib_real.npz + bg.jpg)
    # instead of the sim sensor's polycalib.npz + bg.jpg
    use_real_calib: True
    # CCW rotation (0/90/180/270) aligning depth with real calib/bg orientation.
    # Depth is rotated into the calib frame, rendered, then RGB is rotated back.
    calib_rotation_deg: 270

    # Override ctrl.use_full_rotation (peg_insert/gear_mesh default true, nut_thread default false).
    use_full_rotation: null

    # Friction between gripper and peg (held asset). If set, overrides held_asset_cfg.friction and robot_cfg.friction.
    # Set to null to use individual config values, or specify a float value (e.g., 1.0)
    # Ignored when gripper_peg_friction_randomization is true.
    gripper_peg_friction: 0.75

    # Domain randomization: fixed-asset (socket/hole) friction sampled uniformly per env at each reset.
    fixed_asset_friction_randomization: False
    fixed_asset_friction_range: [0.75, 1.25]  # [min, max] friction when randomization is enabled

    # Domain randomization: gripper-peg friction sampled uniformly per env at each reset.
    gripper_peg_friction_randomization: True  # Set to True to enable friction domain randomization
    gripper_peg_friction_range: [0.4, 1.0]   # [min, max] friction when randomization is enabled

    # Elastomer compliance stiffness for tactile sensors (left and right fingers).
    elastomer_stiffness: 350.0
    # When enabled, overrides elastomer_stiffness with one uniform sample per env at each episode reset.
    # The same sampled stiffness is applied to both finger elastomers.
    elastomer_stiffness_randomization: True
    elastomer_stiffness_range: [200.0, 700.0]  # [min, max] stiffness when randomization is enabled

    # Gripper finger joint PD gains (panda_hand actuator stiffness / damping).
    gripper_kp: 500.0
    gripper_kd: 40.0

    # Gripper finger effort limit (panda_hand actuator effort_limit_sim).
    # gripper_effort_limit: 5.0 # 5 for real
    gripper_effort_limit: 5.0 # 40 for sim

    # Gripper finger PD gain domain randomization (panda_hand stiffness / damping).
    # Samples multiplicative scales on gripper_kp / gripper_kd at each episode reset.
    gripper_kp_kd_randomization: True
    gripper_kp_scale_range: [0.5, 1.1]
    gripper_kd_scale_range: [0.8, 1.2]

    # Arm operational-space control gain domain randomization (task_prop_gains / task_deriv_gains).
    # Samples multiplicative scales on base gains every control update.
    arm_control_gain_randomization: True
    arm_kp_scale_range: [0.8, 1.2]  # multiplicative on task Kp (xyz position + xyz rotation)
    arm_kd_scale_range: [0.8, 1.2]

    # Arm joint friction domain randomization (panda_joint[1-7] actuator friction).
    # panda_arm1 (joints 1-4) and panda_arm2 (joints 5-7) share the same sampled value per env.
    # Resampled at each episode reset.
    joint_friction_randomization: True
    joint_friction_range: [0.0, 0.2]  # [min, max] friction when randomization is enabled

    # Additive Gaussian noise on xyz position command (meters) at execution time.
    # std=0 disables noise. Sampled once per env step; does not affect EMA memory, orientation, or prev_actions.
    action_noise_std: 0.0

    # FORGE-style action threshold domain randomization (pos/rot per-step clip limits).
    # Resampled at each episode reset. noise_level is shared across xyz axes.
    action_threshold_randomization: True
    pos_threshold_noise_level: 0.25  # multiplier range [1/(1+eps), 1+eps] per axis
    rot_threshold_noise_level: 0.29

    # Wrist F/T sensor contact-force penalty (FORGE-style).
    enable_contact_penalty: True  # false = off; true = on (uses contact_penalty_scale or task default)
    contact_penalty_scale: null  # only when enable_contact_penalty=true; null = task default (peg_insert: 0.2)
    contact_penalty_threshold_range: null  # null = task default [2.0, 8.0] N

    # Observation noise for domain randomization (FORGE-style per-step fingertip corruption).
    # Set enable_obs_noise to true to enable; std values are in factory_env_cfg.py (ObsRandCfg).
    obs_noise:
      enable_obs_noise: True  # Set to true to enable observation noise

    # TacSL-style tactile image domain randomization (episode + timestep color/crop).
    # Only affects taxim RGB tactile observations when read_tactile_sensor is enabled.
    tactile_image_aug:
      enable: True

    # Per-episode bias std (meters) on the fixed-asset observation frame (obs-only, not physical spawn).
    # null = ObsRandCfg default [0.001, 0.001, 0.001]; [0, 0, 0] disables.
    fixed_asset_pos: null

    # Include held asset observations (held_pos_rel_fixed and held_quat) in obs_order
    # When enabled, adds held object position relative to fixed asset and held object orientation to policy observations
    include_held_asset_obs: False  # Set to true to include held_pos_rel_fixed and held_quat in observations

    # Include previous action vector in policy observations.
    # Assumes obs history is disabled (history_length == 0).
    include_prev_actions: True  # Set to false to drop prev_actions from policy observation

    # Tactile images are encoded by the CNN above; no latent wrapper is used.
    tactile_obs_wrapper:
      name: null

  config:
    name: Factory_Tactile
    device: cuda:0
    env_name: rlgpu
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True  # Normalize vector observation inputs
    normalize_value: True
    value_bootstrap: True
    num_actors: 128
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.995
    tau: 0.95
    learning_rate: 1.0e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.008
    score_to_win: 20000
    max_epochs: 200
    save_best_after: 10
    save_frequency: 20
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0
    # entropy_coef: 0.0001
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 128
    minibatch_size: 512  # batch size = num_envs * horizon_length; minibatch_size = batch_size / num_minibatches
    mini_epochs: 4
    critic_coef: 2
    clip_value: True
    seq_length: 128
    bounds_loss_coef: 0.0001

    central_value_config:
      minibatch_size: 512
      mini_epochs: 4
      learning_rate: 1e-4
      lr_schedule: adaptive
      kl_threshold: 0.008
      clip_value: True
      normalize_input: True
      truncate_grads: True

      network:
        name: actor_critic
        central_value: True

        mlp:
          units: [512, 128, 64]
          activation: elu
          d2rl: False
          initializer:
            name: default
          regularizer:
            name: None
        rnn:
          name: lstm
          units: 1024
          layers: 2
          before_mlp: True
          concat_input: True
          layer_norm: True
    player:
      deterministic: False
