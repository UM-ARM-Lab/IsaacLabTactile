# Agent configuration for factory peg insertion with tactile sensor
# This config uses CNN for tactile images and MLP for vector observations

params:
  seed: 42
  algo:
    name: a2c_continuous

  env:
    clip_actions: 1.0
    clip_observations: 5.0
    # Configure observation groups - separate tactile images from vector observations
    obs_groups:
      obs: ["vector_obs", "tactile"]  # Must match keys returned by environment
      states: ["critic"]  # Critic observations (asymmetric actor-critic)
    concate_obs_groups: False  # IMPORTANT: Keep groups separate for CNN+MLP routing
    concate_state_groups: True  # Concatenate critic observations into a single tensor

  model:
    name: continuous_a2c_logstd

  network:
    name: multi_modal_actor_critic
    separate: False

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: False
    
    # CNN for processing tactile images (320x240x3)
    # RL-Games will automatically route "tactile" group to CNN based on shape
    cnn:
      type: conv2d
      activation: relu
      initializer:
        name: default
      regularizer:
        name: None
      permute_input: False
      convs:
        - filters: 8
          kernel_size: 8
          strides: 4
          padding: 0
        - filters: 16
          kernel_size: 4
          strides: 2
          padding: 0
        - filters: 16
          kernel_size: 3
          strides: 1
          padding: 0
        - filters: 16
          kernel_size: 3
          strides: 1
          padding: 0
    
    # MLP for processing vector observations (robot state, object state, velocities, actions)
    # RL-Games will automatically route "vector_obs" group (augmented with Point-MAE latent
    # when enabled) to this MLP based on shape.
    mlp:
      units: [512, 128, 64]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: False
  load_path: ""

  # Task-specific overrides (e.g., Factory peg insertion specific parameters)
  task_overrides:
    # Use real calibration file (polycalib_real.npz) instead of simulated calibration (polycalib.npz)
    use_real_calib: True
    # Friction between gripper and peg (held asset). If set, overrides held_asset_cfg.friction and robot_cfg.friction.
    # Set to null to use individual config values, or specify a float value (e.g., 1.0)
    # Ignored when gripper_peg_friction_randomization is true.
    gripper_peg_friction: 0.75

    # Domain randomization: gripper-peg friction sampled uniformly per env at each reset.
    gripper_peg_friction_randomization: False  # Set to true to enable friction domain randomization
    gripper_peg_friction_range: [0.4, 1.0]   # [min, max] friction when randomization is enabled

    # Observation noise for domain randomization
    # Set enable_obs_noise to true to enable observation noise
    # Individual noise parameters are configured in factory_env_cfg.py (ObsRandCfg)
    obs_noise:
      enable_obs_noise: False  # Set to true to enable observation noise
    
    # Include held asset observations (held_pos_rel_fixed and held_quat) in obs_order
    # When enabled, adds held object position relative to fixed asset and held object orientation to policy observations
    include_held_asset_obs: False  # Set to true to include held_pos_rel_fixed and held_quat in observations
    
    # Tactile transfer configuration
    # If transfer_checkpoint is provided, observations will be transferred before being saved to replay buffer
    # This enables training with transferred observations (e.g., simulating real data during training)
    tactile_transfer:
      # Path to tactile transfer model checkpoint (.pt). Set to null to disable transfer.
      # If null, training proceeds without transfer (observations saved as-is to replay buffer).
      # transfer_checkpoint: "/home/fanyang/github/tactile_transfer/outputs/2026-01-18_21-33-55_0059_peg_real_dynamics_small_transfer_w_peg_pose/best_model.pt"  # e.g., "/path/to/tactile_transfer/outputs/.../best_model.pt"
      # transfer_checkpoint: null  # e.g., "/path/to/tactile_transfer/outputs/.../best_model.pt"
      transfer_checkpoint: null
      # transfer_checkpoint: "/home/fanyang/github/tactile_transfer/outputs/2026-01-17_15-24-42_0055_peg_real_dynamics_small_transfer_vis/best_model.pt"
      # Direction of transfer: A_to_B (use model_A) or B_to_A (use model_B)
      # A_to_B: Transfer from domain A to domain B (e.g., sim to real)
      # B_to_A: Transfer from domain B to domain A (e.g., real to sim)
      transfer_direction: A_to_B  # Options: "A_to_B" or "B_to_A"
      # If enabled, transfer both tactile images and vector observations.
      # Otherwise, only transfer tactile images.
      decode_observations: False  # Set to true to transfer both tactile and vector observations

    # Point-MAE tactile point cloud encoder configuration
    # If checkpoint is provided, point clouds and fingertip forces/wrenches will be encoded
    # into a latent token that is concatenated to the vector observations before entering
    # the policy network.
    tactile_pointmae:
      # Path to Point-MAE checkpoint (.pth) saved by tactile_transfer/script/train_point_mae.py.
      # Set to null to disable the Point-MAE encoder during RL training.
      checkpoint: null  # e.g., "/home/fanyang/github/tactile_transfer/outputs/point_mae_pc/point_mae_epoch_0100.pth"
      # Names of observation dictionary entries that contain the tactile point clouds.
      # For the factory peg insertion task with TacSL point clouds enabled, these keys
      # will be provided by the environment; adjust if your task uses different names.
      pc_keys:
        - tactile_pc_left_w
        - tactile_pc_right_w
        - tactile_pc_peg_w
      # Names of observation entries for fingertip forces and wrenches used to build the
      # force token expected by PointMAE (shape 18 = fL(3)+wL(6)+fR(3)+wR(6)).
      force_keys:
        left_force: fingertip_force_left
        left_wrench: fingertip_wrench_left
        right_force: fingertip_force_right
        right_wrench: fingertip_wrench_right

  config:
    name: Factory_Tactile
    device: cuda:0
    env_name: rlgpu
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True  # Normalize vector observation inputs
    normalize_value: True
    value_bootstrap: True
    num_actors: 128
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.995
    tau: 0.95
    learning_rate: 1.0e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.008
    score_to_win: 20000
    max_epochs: 500
    save_best_after: 10
    save_frequency: 20
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0
    # entropy_coef: 0.0001
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 128
    minibatch_size: 512  # batch size = num_envs * horizon_length; minibatch_size = batch_size / num_minibatches
    mini_epochs: 4
    critic_coef: 2
    clip_value: True
    seq_length: 128
    bounds_loss_coef: 0.0001

    central_value_config:
      minibatch_size: 512
      mini_epochs: 4
      learning_rate: 1e-4
      lr_schedule: adaptive
      kl_threshold: 0.008
      clip_value: True
      normalize_input: True
      truncate_grads: True

      network:
        name: actor_critic
        central_value: True

        mlp:
          units: [512, 128, 64]
          activation: elu
          d2rl: False
          initializer:
            name: default
          regularizer:
            name: None
        rnn:
          name: lstm
          units: 1024
          layers: 2
          before_mlp: True
          concat_input: True
          layer_norm: True
    player:
      deterministic: False
