params:
  seed: 0
  algo:
    name: a2c_continuous

  env:
    clip_actions: 1.0

  model:
    # Clamped-log-std variant (registered in force_tool.utils.rlgames_clamped_logstd)
    # bounds sigma so the sharp/low-temp reward can't collapse it to ~0, which
    # otherwise blows up the logged KL and eventually NaNs the sampling path.
    name: continuous_a2c_logstd_clamped

  network:
    name: actor_critic
    separate: False

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: False
    mlp:
      units: [1024, 1024, 512, 256]
      activation: elu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None

    rnn:
      name: lstm
      units: 256
      layers: 1
      before_mlp: True
      concat_input: True
      layer_norm: True

  load_checkpoint: False
  load_path: ""

  config:
    name: FrankaRobustTrack
    device: cuda:0
    env_name: rlgpu
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    value_bootstrap: True
    num_actors: 4096
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.995
    tau: 0.95
    learning_rate: 1.0e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.008
    score_to_win: 20000
    max_epochs: 200
    save_best_after: 10
    save_frequency: 200
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 150
    # batch_size = num_actors(=num_envs) * horizon_length; at 2048 envs this is
    # 262144, so minibatch_size=8192 -> 32 minibatches (matches factory ratio).
    # Must satisfy minibatch_size % seq_length == 0 and batch_size % minibatch_size == 0.
    minibatch_size: 8192
    mini_epochs: 4
    critic_coef: 2
    clip_value: True
    seq_length: 150
    bounds_loss_coef: 0.0001

    # Periodic deterministic (mean-action) eval during training. When enabled,
    # every `eval_interval` epochs the mean policy (mu, no sampled std) is rolled
    # out and its return / task metrics are logged under `eval/*`. `eval_horizon`
    # defaults to the env's max_episode_length when null.
    eval_deterministic: False
    eval_interval: 50
    eval_horizon: null
    eval_full_trajectory: false
    eval_full_interval: 200
    eval_full_horizon: 250

    central_value_config:
      minibatch_size: 8192
      mini_epochs: 4
      learning_rate: 1e-4
      lr_schedule: adaptive
      kl_threshold: 0.008
      clip_value: True
      normalize_input: True
      truncate_grads: True

      network:
        name: actor_critic
        central_value: True

        mlp:
          units: [1024, 512, 256]
          activation: elu
          d2rl: False

          initializer:
            name: default
          regularizer:
            name: None

        rnn:
          name: lstm
          units: 512
          layers: 1
          before_mlp: True
          concat_input: True
          layer_norm: True

    player:
      deterministic: False
